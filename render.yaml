# Configuração Blueprint do Render — vamos-comemorar-api
# Segredos NÃO vão neste arquivo. Cadastre-os em:
# Render Dashboard → Web Service → Environment

services:
  - type: web
    name: vamos-comemorar-api
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Preferir vincular o Postgres ao serviço (injeta DATABASE_URL).
      # Se o serviço foi criado manualmente, defina no painel Environment:
      - key: DATABASE_URL
        sync: false
      - key: FTP_HOST
        sync: false
      - key: FTP_USER
        sync: false
      - key: FTP_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
    disk:
      name: uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
